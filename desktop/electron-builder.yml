appId: com.dharun.dconnect
productName: D-Connect
directories: { buildResources: build }
files: ['out/**', 'resources/**', package.json]
asarUnpack: ['resources/**']
linux:
  target: [AppImage, deb]
  category: Utility
  maintainer: Dharun
  synopsis: Your phone, on your PC
  desktop:
    entry:
      StartupWMClass: d-connect
      Name: D-Connect
  executableArgs: ['--ozone-platform=x11']
win:
  target: nsis
nsis: { oneClick: false, allowToChangeInstallationDirectory: true }
