# Builds every download and publishes a GitHub Release when a version tag is pushed:
#   git tag v0.1.1 && git push origin v0.1.1
# (or run it by hand from the Actions tab, with a tag name).
#   Windows installer (.exe) on Windows, AppImage + .deb on Linux, APK with Flutter.
# Each build uploads straight into the release (no workflow artifacts, which count against the
# account's limited artifact storage).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.1)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # the release first (with the install notes); the builds add their files to it
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: D-Connect ${{ env.TAG }}
          body_path: docs/INSTALL.md

  windows:
    needs: release
    runs-on: windows-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci
      - name: adb for Windows (app windows and USB mode)
        shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile pt.zip
          Expand-Archive pt.zip -DestinationPath pt
          New-Item -ItemType Directory -Force resources-win/adb | Out-Null
          Copy-Item pt/platform-tools/adb.exe, pt/platform-tools/AdbWinApi.dll, pt/platform-tools/AdbWinUsbApi.dll, pt/platform-tools/NOTICE.txt resources-win/adb/
      - run: npx electron-vite build
      # the installer (.exe) and the Microsoft Store package (.appx; Microsoft signs it on submission)
      - run: npx electron-builder --win nsis appx --x64 --publish never
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            desktop/dist/*.exe
            desktop/dist/*.appx

  linux:
    needs: release
    runs-on: ubuntu-22.04
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - run: npm ci
      - run: npx electron-vite build
      - run: npx electron-builder --linux AppImage deb --x64 --publish never
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb

  # Snap Store (Ubuntu App Center). Kept separate so a snap problem never blocks the other builds.
  # The store upload runs only when the SNAPCRAFT_STORE_CREDENTIALS secret exists.
  snap:
    needs: release
    runs-on: ubuntu-22.04
    continue-on-error: true
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: sudo snap install snapcraft --classic
      - run: npm ci
      - run: npx electron-vite build
      - run: npx electron-builder --linux snap --x64 --publish never
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: desktop/dist/*.snap
      - name: Upload to the Snap Store
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then echo "No Snap Store login in secrets: skipping upload"; exit 0; fi
          # "stable" once classic confinement is approved; until then the store holds it for review
          snapcraft upload --release=stable dist/*.snap

  android:
    needs: release
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.44.6', channel: stable, cache: true }
      - run: flutter --version
      - run: flutter pub get
      # sign with the Play upload key kept in the repository's Actions secrets (never in the code);
      # without them the build is debug-signed (fine for the APK, refused by Google Play)
      - name: Upload key from secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "No upload key in secrets: debug-signed build"; exit 0; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          umask 077
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' "$KEY_PASSWORD" "$KEY_PASSWORD" "${KEY_ALIAS:-upload}" "$RUNNER_TEMP/upload.jks" > android/key.properties
          echo "Signing with the upload key"
      # one version for every app: the desktop's package.json (0.1.3 -> versionCode 103)
      - name: Build the APK and the Play bundle
        run: |
          v=$(node -p "require('../desktop/package.json').version")
          code=$(node -p "const [a,b,c]='$v'.split('.').map(Number); a*10000+b*100+c")
          flutter build apk --release --build-name=$v --build-number=$code
          flutter build appbundle --release --build-name=$v --build-number=$code
          cp build/app/outputs/flutter-apk/app-release.apk "D-Connect-$v-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "D-Connect-$v-android.aab"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            mobile/D-Connect-*-android.apk
            mobile/D-Connect-*-android.aab
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/key.properties
