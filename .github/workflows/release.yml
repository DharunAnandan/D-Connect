# Builds every download and publishes a GitHub Release when a version tag is pushed:
#   git tag v0.1.1 && git push origin v0.1.1
# (or run it by hand from the Actions tab, with a tag name).
#   Windows installer (.exe) on Windows, AppImage + .deb on Linux, APK with Flutter.
# Each build uploads straight into the release (no workflow artifacts, which count against the
# account's limited artifact storage).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.1)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # the release first (with the install notes); the builds add their files to it
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: D-Connect ${{ env.TAG }}
          body_path: docs/INSTALL.md

  windows:
    needs: release
    runs-on: windows-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci
      - run: npx electron-vite build
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: desktop/dist/*.exe

  linux:
    needs: release
    runs-on: ubuntu-22.04
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - run: npm ci
      - run: npx electron-vite build
      - run: npx electron-builder --linux AppImage deb --x64 --publish never
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb

  android:
    needs: release
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.44.6', channel: stable, cache: true }
      - run: flutter --version
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Name the APK after the version
        run: |
          v=$(node -p "require('../desktop/package.json').version")
          cp build/app/outputs/flutter-apk/app-release.apk "D-Connect-$v-android.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: mobile/D-Connect-*-android.apk
